      $("#gp-plan").innerHTML = "图谱引擎（G6）加载失败，降级为文本拓扑：<b>" + d.node_count + "</b> 节点 · <b>"
        + d.edge_count + "</b> 边。已注册 agent："
        + (d.nodes || []).filter(x => x.type === "agent" || x.type === "main")
            .map(x => esc(x.label)).join("、");
      $("#gp-chart").innerHTML = '<div style="padding:18px;color:#a32d2d;font-size:13px;line-height:1.8">'
        + 'g6.min.js 不可用（网络或部署问题）。<br>拓扑数据接口 /v1/graph 正常，可刷新重试或检查部署。</div>';
    } catch (e) {
      $("#gp-plan").textContent = "图谱加载失败：" + e.message;
    }
    return;
  }
  window.gpReloadTopology = async function () { // S1：Hub 安装/绑定/卸载后重拉拓扑（注册表变更即刻反映）
    try {
      const d = await jget("/v1/graph");
      if (!GRAPH.chart) { GRAPH.data = d; return; }
      gpInitPos(d); GRAPH.data = d; GRAPH.lit.clear();
      GRAPH.chart.changeData({ nodes: buildNodes(), edges: buildEdges() });
      GRAPH.chart.render(); renderGraph();
      $("#gp-plan").innerHTML = "注册拓扑：<b>" + d.node_count + "</b> 节点 · <b>" + d.edge_count + "</b> 关联边。";
    } catch (e) { /* 拉取失败保留旧拓扑 */ }
  };
  try {
    const gd = await jget("/v1/graph");
    gpInitPos(gd);
    GRAPH.data = gd;
    if (GRAPH.chart) {
      GRAPH.chart.data({ nodes: buildNodes(), edges: buildEdges() });
      GRAPH.chart.render();
    }
    $("#gp-plan").innerHTML = "注册拓扑：<b>" + gd.node_count + "</b> 节点 · <b>" + gd.edge_count
      + "</b> 关联边。点击节点/边查看详情；任务开始后由主 agent 规划分派，参与对象依次点亮并流动。";
  } catch (e) {
    $("#gp-plan").textContent = "图谱加载失败：" + e.message;
  }
}

/** 节点类别索引：0 主 agent / 1 专业 agent / 2 skill / 3 MCP / 4 市场目录。 */
function gpCat(n) {
  // S8：agent 节点按执行形态细分——workflow/ReAct/DeepAgent 三色区分
  if (n.state === "market") return 4;
  if (n.type === "main") return n.exec_form === "deepagent" ? 6 : 0;
  if (n.type === "agent") {
    if (n.exec_form === "react") return 5;
    if (n.exec_form === "deepagent") return 6;
    return 1;
  }
  return n.type === "skill" ? 2 : 3;
}

/** 初始坐标：分层同心环（主编居中 / agents 内环 / skills 中环 / MCP 外环），force 以此为起点有机收敛，防重叠防出界。 */
function gpInitPos(d) {
  const cx = 215, cy = 212;
  const groups = { agent: [], skill: [], mcp: [] };
  (d.nodes || []).forEach(n => {
    if (n.type === "main") { n.x = cx; n.y = cy; return; }
    groups[n.state === "market" || n.type === "agent" ? "agent"
      : n.type === "skill" ? "skill" : "mcp"].push(n);
  });
  const place = (arr, rad) => arr.forEach((n, i) => {
    const a = (2 * Math.PI * i) / arr.length - Math.PI / 2;
    n.x = Math.round(cx + rad * 0.94 * Math.cos(a));
    n.y = Math.round(cy + rad * 0.85 * Math.sin(a));
  });
  place(groups.agent, 100);
  place(groups.skill, 172);
  place(groups.mcp, 236);
}

function buildNodes() {
  return (GRAPH.data.nodes || []).map(n => {
    const cat = gpCat(n), col = GP_CATS[cat].color, isMain = n.type === "main";
    return {
      id: n.id, label: shortLabel(n.label), _raw: n,
      type: "circle",
      size: isMain ? 56 : cat === 6 ? 44 : cat === 5 ? 38 : cat === 1 ? 30 : cat === 3 ? 28 : cat === 4 ? 22 : 24,
      x: n.x, y: n.y,
      style: { fill: col, stroke: "#fff", lineWidth: isMain ? 3 : 1.5,
        opacity: n.state === "market" ? 0.6 : 1,                       // S1：市场目录（未安装）降透明
        lineDash: n.state === "market" ? [4, 3] : null,                 // S1：后端注释承诺的「虚线呈现」落地
        cursor: "pointer" },
      labelCfg: { position: "bottom", offset: 4,
        style: { fill: "#39404d", fontSize: cat === 4 ? 9 : isMain ? 12 : 10.5,
          fontWeight: isMain ? 700 : 500 } }
    };
  });
}

function buildEdges() {
  return (GRAPH.data.edges || []).map(e => ({
    source: e.from, target: e.to, kind: e.kind, klabel: e.label,
    style: { stroke: GP_ECOLOR[e.kind] || "#b6bcc6", lineWidth: 1.3, opacity: 0.5,
      cursor: "pointer", lineDash: e.kind === "register" ? [4, 3] : null }
  }));
}

/** S6/G15：token 飞行粒子层 —— overlay canvas 叠在 G6 之上，requestAnimationFrame 驱动。
 *  点亮边发射沿边飞行的圆点（调用发出语义）；reduced-motion 时不发射（G17）。
 *  独立于 g6.min.js（该构建无 element.animate），零侵入。 */
function gpEnsureTokenLayer() {
  if (GRAPH.tokenLayer) return;
  const body = document.querySelector(".gp-body");
  const chart = document.getElementById("gp-chart");
  if (!body || !chart) return;
  const cv = document.createElement("canvas");
  cv.style.cssText = "position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3";
  body.insertBefore(cv, body.firstChild);
  const ro = () => { cv.width = chart.clientWidth * 2; cv.height = chart.clientHeight * 2; };
  ro(); new ResizeObserver(ro).observe(chart);
  GRAPH.tokenLayer = cv; GRAPH.tctx = cv.getContext("2d");
}
function gpEdgeTokens() {
  // 点亮边：两端节点屏幕坐标 + 关系色
  const out = [];
  if (!GRAPH.chart || !GRAPH.data) return out;
  const m = GRAPH.chart.getEdges().map(e => e.getModel());
  const src = {};
  GRAPH.chart.getNodes().forEach(n => { const mm = n.getModel(); src[mm.id] = n; });
  m.forEach(e => {
    if (!GRAPH.running || !GRAPH.lit.has(e.source) || !GRAPH.lit.has(e.target)) return;
    const a = src[e.source], b = src[e.target];
    if (!a || !b) return;
    out.push({ a, b, color: (e.style || {}).stroke || "#3b7bf5" });
  });
  return out;
}
function gpSpawnTokens() {
  gpEnsureTokenLayer();
  if (GRAPH.reduced || !GRAPH.tokenLayer) return; // G17
  gpEdgeTokens().forEach((e, i) => {
    for (let k = 0; k < 2; k++)
      GRAPH.tokens.push({ edge: e, p: (i * 0.13 + k * 0.5) % 1, speed: 0.006 });
  });
  if (!GRAPH.rafId) gpTick();
}
function gpClearTokens() { GRAPH.tokens = []; }
function gpTick() {
  GRAPH.rafId = requestAnimationFrame(gpTick);
  const ctx = GRAPH.tctx, cv = GRAPH.tokenLayer;
  if (!ctx || !cv) return;
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!GRAPH.tokens.length) return;
  const pt = (item, canvasPt) => {
    // G6 item 屏幕坐标 → canvas 像素（2x）
    const m = item.get("group").getCanvasBBox ? item.get("group").getCanvasBBox() : { x: 0, y: 0 };
    const box = GRAPH.chart.get("canvas").getPointByClient ? null : null;
    return { x: (m.x + (m.width || 0) / 2) * 2, y: (m.y + (m.height || 0) / 2) * 2 };
  };
  const alive = [];
  for (const tk of GRAPH.tokens) {
    if (!GRAPH.running) continue; // 运行结束停发
    tk.p += tk.speed;
    if (tk.p > 1) { tk.p = 0; }
    try {
      const A = pt(tk.edge.a), B = pt(tk.edge.b);
      const x = A.x + (B.x - A.x) * tk.p, y = A.y + (B.y - A.y) * tk.p;
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = tk.edge.color; ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); // 尾迹光晕
      ctx.globalAlpha = 0.18; ctx.fill(); ctx.globalAlpha = 1;
      alive.push(tk);
    } catch (e) { /* 单 token 失败不阻断 */ }
  }
  GRAPH.tokens = alive.slice(-40); // 上限防膨胀
}

/** 状态渲染：运行态点亮/淡显、点击聚焦邻域、点亮边蚂蚁线流动（增量 updateItem）。 */
function renderGraph() {
  const g = GRAPH.chart;
  if (!g || !GRAPH.data) return;
  const nb = new Set();
  if (GRAPH.focus && GRAPH.focus.type === "node") {
    nb.add(GRAPH.focus.id);
    (GRAPH.data.edges || []).forEach(e => {
      if (e.from === GRAPH.focus.id) nb.add(e.to);
      if (e.to === GRAPH.focus.id) nb.add(e.from);
    });
  }
  g.getNodes().forEach(node => {
    try {
    const m = node.getModel(), raw = m._raw;
    if (!raw) return;
    const isMain = raw.type === "main", lit = GRAPH.lit.has(m.id);
    let op = 1, sb = 0, bw = isMain ? 3 : 1.5;
    if (GRAPH.running && !lit && !isMain) op = nb.has(m.id) ? 0.5 : 0.14;
    else if (!GRAPH.running && GRAPH.focus && !nb.has(m.id) && !isMain) op = 0.12;
    if (isMain) sb = 16; else if (lit) { sb = 13; bw = 2.5; }
    g.updateItem(node, { style: { opacity: op, shadowBlur: sb,
        shadowColor: GP_CATS[gpCat(raw)].color, lineWidth: bw },
      labelCfg: { style: { fill: op < 0.5 ? "#cdd2da" : "#39404d" } } });
    } catch (e) { /* 单节点失败不阻断流水线驱动 */ }
  });
  g.getEdges().forEach(edge => {
    try {
    const m = edge.getModel();
    const lit = GRAPH.running && GRAPH.lit.has(m.source) && GRAPH.lit.has(m.target);
    let op = 0.5, w = 1.3;
    if (GRAPH.focus && GRAPH.focus.type === "node") {
      const rel = m.source === GRAPH.focus.id || m.target === GRAPH.focus.id;
      op = rel ? 0.95 : 0.08; w = rel ? 2.4 : 1.2;
    } else if (GRAPH.focus && GRAPH.focus.type === "edge") {
      const rel = m.source === GRAPH.focus.from && m.target === GRAPH.focus.to;
      op = rel ? 1 : 0.1; w = rel ? 3 : 1.2;
    } else if (GRAPH.running) {
      op = lit ? 0.85 : 0.06; w = lit ? 2.2 : 1.1;
    }
    g.updateItem(edge, { style: { opacity: op, lineWidth: w,
      lineDash: lit ? [7, 6] : (m.kind === "register" ? [4, 3] : null) } });
    // 流动：运行态点亮边快流；空闲态全部边慢流（全图始终有动态生命感）
    if (lit || !GRAPH.running) gpEdgeFlow(edge); else gpEdgeStop(edge);
    } catch (e) { /* 单边失败不阻断流水线驱动 */ }
  });
}

/** 点亮边蚂蚁线流动：定时器 + updateItem 全量样式重设（走 G6 正规更新通道强制重绘，
 *  G6 4.x min 构建 element.animate 缺失、直改 shape.attr 不入渲染队列）。 */
function gpEdgeFlow(edge) {
  edge.__flow = true;
  if (!GRAPH.flowTimer) {
    GRAPH.flowOffset = 0;
    GRAPH.flowTimer = setInterval(() => {
      const g = GRAPH.chart;
      if (!g) return;
      GRAPH.flowOffset = (GRAPH.flowOffset - GRAPH.flowSpeed) % 26;
      g.getEdges().forEach(edge => {
        if (!edge.__flow) return;
        try {
          const s = edge.getModel().style || {};
          g.updateItem(edge, { style: { stroke: s.stroke, lineWidth: s.lineWidth,
            opacity: s.opacity, lineDash: [7, 6], lineDashOffset: GRAPH.flowOffset } });
        } catch (e) { /* 单边失败不阻断 */ }
      });
    }, 70);
  }
}
function gpEdgeStop(edge) {
  edge.__flow = false;
  try {
    if (GRAPH.chart) GRAPH.chart.updateItem(edge, { style: { lineDashOffset: 0 } });
  } catch (e) { /* ignore */ }
  if (GRAPH.flowTimer && GRAPH.chart && !GRAPH.chart.getEdges().some(e => e.__flow)) {
    clearInterval(GRAPH.flowTimer);
    GRAPH.flowTimer = null;
  }
}

/** 点击节点/边的详情卡：节点显示类型/职责/全部关联；边显示两端与关系语义。 */
function renderInfoCard() {
  const el = document.getElementById("gp-info");
  if (!el) return;
  const f = GRAPH.focus, d = GRAPH.data;
  if (!f || !d) { el.style.display = "none"; el.innerHTML = ""; return; }
  let html = "";
  if (f.type === "node") {
    const n = (d.nodes || []).find(x => x.id === f.id);
    if (!n) { GRAPH.focus = null; el.style.display = "none"; return; }
    const col = GP_CATS[gpCat(n)].color;
    const rel = (d.edges || []).filter(e => e.from === n.id || e.to === n.id);
    const typeName = n.type === "main" ? "主 agent" : n.type === "agent" ? "专业 agent"
      : n.type === "skill" ? "skill" : "MCP 工具"
    const execLabel = n.exec_form ? ({react: "ReAct 循环", deepagent: "DeepAgent", workflow: "Workflow 工位"}[n.exec_form] || n.exec_form) + (n.id === "agent:writer-agent" ? " · 执行载体 writer-deepagent" : n.id === "agent:w06-orchestrator-root" ? " · 即 skill-app-agent 容器" : "") : null;;
    html = '<div class="gi-head"><i style="background:' + col + '"></i><b>' + esc(n.label) + "</b>"
      + '<span class="gi-tag">' + typeName + (execLabel ? " · " + execLabel : "") + (n.state === "market" ? " · 市场目录" : " · 运行时") + "</span>"
      + '<button class="gi-close" data-close="1">×</button></div>'
      + (n.desc ? '<div class="gi-desc">' + esc(n.desc) + "</div>" : "")
      + '<div class="gi-rel"><b>关联 ' + rel.length + " 条</b>" + rel.map(e => {
        const otherId = e.from === n.id ? e.to : e.from;
        const on = (d.nodes || []).find(x => x.id === otherId);
        const dir = e.from === n.id ? "→" : "←";
        return "<div>" + esc((on ? on.label : otherId) + " " + dir + " " + (e.label || e.kind)) + "</div>";
      }).join("") + "</div>";
  } else {
    const e = (d.edges || []).find(x => x.from === f.from && x.to === f.to);
    if (!e) { GRAPH.focus = null; el.style.display = "none"; return; }
    const a = (d.nodes || []).find(x => x.id === e.from);
    const b = (d.nodes || []).find(x => x.id === e.to);
    html = '<div class="gi-head"><i style="background:' + (GP_ECOLOR[e.kind] || "#999") + '"></i><b>' + esc(e.label || e.kind) + "</b>"
      + '<span class="gi-tag">关系</span><button class="gi-close" data-close="1">×</button></div>'
      + '<div class="gi-desc">' + esc((a ? a.label : e.from) + " → " + (b ? b.label : e.to)) + "</div>";
  }
  el.innerHTML = html;
  el.style.display = "block";
  const c = el.querySelector("[data-close]");
  if (c) c.onclick = () => { GRAPH.focus = null; renderGraph(); renderInfoCard(); };
}

function shortLabel(s) {
  s = String(s || "");
  return s.length > 12 ? s.slice(0, 11) + "…" : s;
}

function setGpStatus(cls, text) {
  const s = document.getElementById("gp-status");
  if (!s) return;
  s.className = "gp-status" + (cls ? " " + cls : "");
  const t = document.getElementById("gp-status-text");
  if (t) t.textContent = text;
}
function gpLight(id) { // G10：点亮前校验节点存在，标注悬空 id 时在状态条提示而非静默
  if (!GRAPH.data || !(GRAPH.data.nodes || []).some(n => n.id === id)) {
    const s = document.getElementById("gp-status-text");
    if (s) s.textContent = "点亮对象不在注册拓扑：" + id + "（标注与注册表漂移，请检查）";
  }
  GRAPH.lit.add(id); renderGraph();
}
async function graphStage(st) {
  if (!GRAPH.data || !st) return;
  // S6/G5：每工位重建当前子图（lit 只含本工位参与对象），历史累计进 trail ——
  // 「点亮=当前工位」，不再全任务并集糊成一片；graphFinish 用 trail 复亮全量。
  const ids = (st.tools || []).length ? ["agent:editor-in-chief", "mcp:gateway"]
    : ["agent:editor-in-chief"];
  (st.nodes || []).forEach(a => { if (!ids.includes("agent:" + a)) ids.push("agent:" + a); });
  (st.skills || []).forEach(s => { const id = "skill:" + s; if (!ids.includes(id)) ids.push(id); });
  (st.tools || []).forEach(t => { const id = "mcp:" + t; if (!ids.includes(id)) ids.push(id); });
  GRAPH.lit.clear();
  ids.forEach(id => { GRAPH.trail.add(id); try { gpLight(id); } catch (e) { /* 单点失败不阻断 */ } });
  const parts = [];
  if ((st.nodes || []).length) parts.push("agent×" + st.nodes.length);
  if ((st.skills || []).length) parts.push("skill×" + st.skills.length);
  if ((st.tools || []).length) parts.push("MCP 工具×" + st.tools.length);
  setGpStatus("run", "【" + (st.name || st.stage_id || "") + "工位】" + (st.headline || "") + "　参与：" + (parts.join(" · ") || "—"));
  gpSpawnTokens(); // S6：为点亮边发射飞行 token（调用语义）
  await sleep(420); // 工位间停顿给子图观察时间（原 120/id 太碎）
}
function graphBeginRun(plan) {
  GRAPH.running = true;
  GRAPH.flowSpeed = 0.8;
  GRAPH.lit.clear();            // S1：新任务清空上一任务点亮，防跨任务污染
  GRAPH.trail.clear();          // S6：新任务历史轨迹清零
  GRAPH.focus = null;
  if (plan && plan.summary) $("#gp-plan").innerHTML = "<b>主 agent 规划</b> — " + esc(plan.summary);
  setGpStatus("run", "主 agent 任务理解与规划中…");
  renderGraph();
}
function graphFinish() {
  // S6/G5：结束时用 trail 复亮本次任务全部参与对象（真实历史，非六工位糊亮）
  GRAPH.lit = new Set(GRAPH.trail);
  renderGraph();
  gpSpawnTokens();
  setGpStatus("done", "任务执行完成（按流水线结果回放）—— 本次累计参与 " + GRAPH.trail.size
    + " 个对象已复亮；工位时序为响应后回放，非实时执行");
}
function graphReset() {
  GRAPH.running = false;
  GRAPH.flowSpeed = 0.35;
  GRAPH.lit.clear();
  GRAPH.trail.clear();
  gpClearTokens();
  setGpStatus("", "空闲 —— 点击节点查看详情；任务开始后按主 agent 规划依次点亮参与对象");
  renderGraph();
}

function fmtBytes(b) {
  if (b == null) return "";
  return b < 1024 ? b + " B" : (b / 1024).toFixed(1) + " KB";
}

/** 点击技能包文件加载预览：md → 渲染；py/json → 代码块。 */
function loadSkillFile(skillId, filePath) {
  const view = document.getElementById("skill-content-view");
  const label = document.getElementById("skill-content-label");
  if (!view) return;
  if (label) label.textContent = "内容预览 · " + filePath;
  view.innerHTML = '<span style="color:var(--muted);font-size:12px">加载中…</span>';
  // 高亮当前选中文件
  document.querySelectorAll(".st-file.sel").forEach(el => el.classList.remove("sel"));
  document.querySelectorAll(".st-file").forEach(el => {
    if (el.getAttribute("onclick") && el.getAttribute("onclick").includes("'" + filePath + "'")) el.classList.add("sel");
  });
  jget("/v1/skills/" + encodeURIComponent(skillId) + "/files?path=" + encodeURIComponent(filePath)).then(fc => {
    if (!fc || !fc.content) {
      view.innerHTML = '<span style="color:#a32d2d">不可用：' + esc((fc && fc.message) || "未知错误") + "</span>";
      return;
    }
    const ext = filePath.split(".").pop().toLowerCase();
    const head = '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">'
      + esc(filePath) + " · " + fmtBytes(fc.bytes) + " · " + fc.lines + " 行</div>";
    if (ext === "md") {
      view.innerHTML = '<div class="skill-doc">' + head + renderMarkdown(fc.content) + "</div>";
    } else {
      // py/json/txt 原文展示（代码块）
      const lang = ext === "py" ? "python" : (ext === "json" ? "json" : "text");
      view.innerHTML = head + '<pre class="skill-code"><code>' + esc(fc.content) + "</code></pre>"
        + '<div style="font-size:11px;color:var(--muted);margin-top:4px">类型：' + lang + " · 原文展示</div>";
    }
  }).catch(e => {
    view.innerHTML = '<span style="color:#a32d2d">加载失败：' + esc(e.message) + "</span>";
  });
}

/** 轻量 Markdown 渲染（标题/表格/代码块/列表/粗体，预览用，不引外部库）。 */
function renderMarkdown(md) {
  function esc2(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  const lines = String(md).split("\n");
  let out = "", inCode = false, tableBuf = [];
  const flushTable = () => {
    if (!tableBuf.length) return;
    let html = "<table>";
    tableBuf.forEach((row, ri) => {
      if (ri === 1 && /^[-\s|:]+$/.test(row)) return;
      const cells = row.split("|").map(c => c.trim()).filter((c, idx, arr) => !(idx === 0 && c === "") && !(idx === arr.length - 1 && c === ""));
      html += "<tr>" + cells.map(c => "<" + (ri === 0 ? "th" : "td") + ">" + esc2(c) + "</" + (ri === 0 ? "th" : "td") + ">").join("") + "</tr>";
    });
    out += html + "</table>";
    tableBuf = [];
  };
  for (const l of lines) {
    if (l.trim().startsWith("```")) { flushTable(); if (inCode) { out += "</pre>"; inCode = false; } else { out += "<pre>"; inCode = true; } continue; }
    if (inCode) { out += esc2(l) + "\n"; continue; }
    if (/^\|.*\|/.test(l.trim())) { tableBuf.push(l.trim()); continue; }
    flushTable();
    if (/^#{1,6}\s/.test(l)) { const lvl = l.match(/^#+/)[0].length; out += "<h" + Math.min(lvl+1,6) + ">" + esc2(l.replace(/^#+\s*/, "")) + "</h" + Math.min(lvl+1,6) + ">"; continue; }
    if (/^(-{3,})$/.test(l.trim())) { out += "<hr>"; continue; }
    if (/^[-*]\s/.test(l.trim())) { out += "<li>" + inlineMd(esc2(l.trim().replace(/^[-*]\s*/, ""))) + "</li>"; continue; }
    if (!l.trim()) { out += "<div style=\"height:6px\"></div>"; continue; }
    out += "<p>" + inlineMd(esc2(l)) + "</p>";
  }
  if (inCode) out += "</pre>";
  flushTable();
  function inlineMd(t) { return t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>"); }
  return out;
}

function submitRegisterAgent(ev) {

  if (!name) { msg.style.color = "#c0392b"; msg.textContent = "请填写名称。"; return false; }
  const kind = $("#reg-agent-kind").value;
  const caps = $("#reg-agent-caps").value.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
  const desc = $("#reg-agent-desc").value.trim();
  submitRegisterAgentRun(name, kind, caps, desc);

async function submitRegisterAgentRun(name, kind, caps, desc) {
  const msg = $("#reg-agent-msg");
  msg.style.color = "var(--muted)";

  const r = await jpost("/v1/agents/register", { name: name, kind: kind, capabilities: caps, description: desc });
  if (r.ok) {
    const a = r.data || {};
    msg.style.color = "var(--success)";
    msg.textContent = "已注册 " + (a.agent_id || "新 agent") + "（v" + (a.version || "1.0") + "），已加入运行时。";
    $("#reg-agent-name").value = ""; $("#reg-agent-caps").value = ""; $("#reg-agent-desc").value = "";
    try { state.agentsData = await jget("/v1/agents"); } catch (e) {}
    renderAssets();

    msg.style.color = "#c0392b";
    msg.textContent = "注册失败：" + ((r.data || {}).message || "HTTP " + r.status);

}

  const step = $("#demo-step-" + no);
  if (step) step.className = "step " + cls;
  const b = $("#demo-badge-" + no);
  if (b) {
    b.className = "badge " + ({ done: "success", blocked: "destructive", refused: "warning" }[cls] || "neutral");
    b.textContent = badge;
  }
  if (res !== undefined) { const el = $("#demo-res-" + no); if (el) el.innerHTML = res; }
}

function demoStep1() {
  state.artifact = clone(state.positive);
  setStep(1, "done", "正例已载入",
    '<div class="quote">' + esc(s2Sentence(state.artifact)).replace("下降20.19个百分点",
      '<span class="fix">下降20.19个百分点</span>') + "</div>"
    + '<div class="pass-note">口径正确：比率变动以「个百分点」表述，符合 N7 变动口径铁律。</div>');
}
async function demoStep2() {
  const a = await jget("/demo/error-artifact.json");
  state.artifact = a;
  const r = await jpost("/v1/checks/numeric", a);
  setStep(2, "blocked", "已拦截",
    '<div class="quote">' + esc(s2Sentence(a)).replace("下降20.19%", "<mark>下降20.19%</mark>") + "</div>"
    + vioRows(r.data.violations)
    + '<div class="refused-card">BLOCKING：草稿被当场拒收——「下降20.19%」口径违反 N7 变动口径铁律。</div>');
}
async function demoStep3() {
  const a = state.artifact;
  s2body(a).body = s2body(a).body.replace("下降20.19%", "下降20.19个百分点");
  const n = await jpost("/v1/checks/numeric", a);
  const c = await jpost("/v1/checks/citation", a);
  setStep(3, "done", "双检通过",
    '<div class="quote">' + esc(s2Sentence(a)).replace("下降20.19个百分点",
      '<span class="fix">下降20.19个百分点</span>') + "</div>"
    + '<div class="pass-note">数值核验 PASSED · v' + esc(n.data.checker_version) + "（仅改该句口径，其余零改动）</div>"
    + '<div class="pass-note">引用核验 PASSED · v' + esc(c.data.checker_version) + "</div>");
}
async function demoStep4() {
  const r = await jpost("/v1/approvals?approver=" + encodeURIComponent("Alice"), state.artifact);
  if (!r.ok) {
    setStep(4, "blocked", "失败", '<div class="refused-card">HTTP ' + r.status + "：" + esc((r.data || {}).message || "") + "</div>");
    return;
  }
  state.approval = r.data;
  setStep(4, "done", "已批准",
    '<div class="approval-card"><b style="color:var(--success)">交付批准已签发</b><div class="a-grid">'
    + '<span><b>批准编号</b><span class="mono">' + esc(r.data.approval_id) + "</span></span>"
    + "<span><b>批准人</b>" + esc(r.data.approver) + "</span>"
    + '<span><b>批准时间</b><span class="mono">' + esc(r.data.approved_at) + "</span></span>"
    + "<span><b>数值核验</b>PASSED · " + esc(r.data.checks.numeric.checker_version) + "</span>"
    + "<span><b>引用核验</b>PASSED · " + esc(r.data.checks.citation.checker_version) + "</span>"
    + '<span><b>工件指纹</b><span class="digest">' + esc(r.data.artifact_digest) + "</span></span></div></div>");
}
async function demoStep5() {
  const a = state.artifact;
  const pv = a.metrics.find(m => m.key === "PROVISION_COVERAGE");
  pv.value = "391.99";
  s2body(a).body = s2body(a).body.replace("拨备覆盖率391.79%", "拨备覆盖率391.99%");
  const dg = await jpost("/v1/artifacts/digest", a);
  const n = await jpost("/v1/checks/numeric", a);
  const ap = await jpost("/v1/approvals?approver=" + encodeURIComponent("Alice"), a);
  setStep(5, "refused", "篡改无效",
    '<div class="diff-banner"><div>'
    + "批准记录绑定的工件指纹 ≠ 篡改稿指纹，既有批准立即失效：<br>"
    + '批准时指纹 <span class="digest">' + esc(state.approval ? state.approval.artifact_digest : "—") + "</span><br>"
    + '篡改稿指纹 <span class="digest">' + esc(dg.data.artifact_digest) + "</div></div>"
    + vioRows(n.data.violations)
    + (ap.ok
      ? ""
      : '<div class="refused-card">POST /v1/approvals → HTTP ' + ap.status + " "
      + esc((ap.data || {}).status || "") + "：" + esc((ap.data || {}).message || "") + "</div>"));
}
function demoStep6() {
  state.artifact = clone(state.positive);
  renderDemoShell();
  setStep(6, "done", "已重置", '<div class="pass-note">演示已重置：正例工件已载入，各步状态清零。</div>');
}

function renderDemoShell() {
  $("#view-demo").innerHTML =
    '<div class="card"><h3>演示链：从「口径错误拦截」到「篡改失效」 <span class="hint">六步 · 每步真实调用后端 API</span></h3>'
    + '<div style="font-size:12.5px;color:var(--muted);line-height:1.9;margin-bottom:16px">'
    + "本演示链复现受控交付的关键能力：<b>错误被当场拦截</b> → <b>修订后双检通过</b> → <b>具名批准与内容指纹绑定</b> → <b>任何篡改使批准立即失效</b>。"
    + "请按编号顺序点击各步按钮。</div>"
    + '<div id="demo-steps"></div></div>';
  demoStep(1, "载入正例工件", "口径正确版本：拨备覆盖率较上年末下降 20.19 个百分点。", "载入正例", demoStep1);
  demoStep(2, "注入「%」口径草稿", "同一份年报把「个百分点」写成「%」——数值核验器应当场拦截。", "注入口径错误草稿", demoStep2);
  demoStep(3, "采纳修订并双检重跑", "把「%」改回「个百分点」，数值与引用核验重跑。", "修订为「个百分点」", demoStep3);
  demoStep(4, "具名批准交付", "批准记录绑定工件内容指纹（sha256），批准人 Alice。", "Alice 批准交付", demoStep4);
  demoStep(5, "篡改检测：改动指标再申请批准", "把拨备覆盖率 391.79% 篡改为 391.99%，既有批准应立即失效、新批准被拒绝。", "篡改指标后申请批准", demoStep5);
  demoStep(6, "重置演示", "恢复正例工件、清零步骤状态。", "重置演示", demoStep6);
}

/* ———————————————————— 初始化 ———————————————————— */
async function init() {
  try {
    const [health, manifest, positive, banks] = await Promise.all([
      jget("/health"), jget("/v1/snapshot/manifest"), jget("/demo/positive-artifact.json"), jget("/v1/banks")
    ]);
    state.health = health;
    state.manifest = manifest;
    state.positive = positive;
    state.artifact = clone(positive);
    state.citeArtifact = state.artifact;
    state.banks = Array.isArray(banks) ? banks : [];
    /* 各银行快照 manifest 并行装载（对话流按所选银行取指标索引/释义） */
    const mans = await Promise.all(state.banks.map(b =>
      jget("/v1/snapshot/manifest?bank=" + b.bank).then(m => [b.bank, m]).catch(() => [b.bank, manifest])));
    state.manifests = Object.fromEntries(mans);
    const hb = $("#health-badge");
    if (health.status === "ok") { hb.className = "badge success"; hb.textContent = "服务正常"; }
    else { hb.className = "badge warning"; hb.textContent = health.status || "状态未知"; }
    $("#health-ver").textContent = "vNumericChecker " + (health.numeric_checker_version || "?")
      + " · vCitationChecker " + (health.citation_checker_version || "?")
      + " · 银行快照 " + state.banks.length + " 家";
    const p46 = await jget("/v1/snapshot/pages/46");
    state.y2024 = extract2024(p46.text);
    state.y2024s = { cmb: state.y2024 };
    ASSETS_RENDER = renderAssets();
    renderDemoShell();
    greet();
    refreshTasks();
    refreshAgents();
  } catch (e) {
    const hb = $("#health-badge");
    hb.className = "badge destructive";
    hb.textContent = "初始化失败";
    addMsg("editor-in-chief", '<span style="color:var(--destructive)">初始化失败：' + esc(e.message) + "</span>");
  }
}
init();

initGraphPanel();
</script>
